# Publie le lecteur sur GitHub Pages, seulement si les tests passent.
#
# Site produit par scripts/build-pages.js :
#   /           la branche main (version de développement)
#   /vX.Y/      chaque étiquette git v*, figée : l'adresse à donner à une machine d'installation
#   sw.js       dans chaque version, le service worker qui la rend jouable hors ligne
#
# Déclenché par un push sur main, par une nouvelle étiquette v*, ou à la main.

name: Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Deux jobs, comme le modèle de GitHub : dans un seul job, deploy-pages cherche parfois
  # l'artefact quelques millisecondes après son envoi, avant qu'il soit enregistré, et échoue
  # (« No artifacts named "github-pages" », actions/deploy-pages#451). Le 25 novembre 2026,
  # quatre publications de suite ont échoué ainsi, relance comprise.
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # toutes les étiquettes, pour publier chaque version figée
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "Tests (sans SBCL ni module MIDI : ces parties sont sautées)"
        run: npm test
      - name: Construction du site
        run: node scripts/build-pages.js site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
